<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" font-family="'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<style>
.bg{fill:#FFFFFF}
.src{fill:#F8FAFC;stroke:#94A3B8;stroke-width:1.2}
.fs{fill:#EEF4FF;stroke:#3370FF;stroke-width:1.4}
.acct{fill:#F8FAFC;stroke:#64748B;stroke-width:1.2;stroke-dasharray:6 4}
.agent{fill:#FFF7EB;stroke:#FF9900;stroke-width:1.8}
.data{fill:#F2F8F1;stroke:#6AA84F;stroke-width:1.2}
.in{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1}
.gov{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1}
.t{fill:#111827;font-size:14px;font-weight:700}
.ti{fill:#111827;font-size:12.5px;font-weight:700}
.s{fill:#374151;font-size:12px}
.xs{fill:#4B5563;font-size:11px}
.lbl{fill:#374151;font-size:11px}
.warn{fill:#B45309;font-size:11.5px;font-weight:700}
.ok{fill:#15803D;font-size:11.5px;font-weight:700}
.h{fill:#0F172A;font-size:19px;font-weight:700}
.ln{stroke:#475569;stroke-width:1.6;fill:none}
.mk{fill:#475569}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker></defs>
<rect width="1400" height="830" class="bg"/>
<text x="20" y="36" class="h">目标架构：AWS DevOps Agent + 飞书应用机器人 · us-east-1</text>

<!-- column A -->
<rect x="20" y="60" width="220" height="160" rx="8" class="src"/>
<text x="34" y="84" class="t">告警源</text>
<text x="34" y="108" class="s">Amazon CloudWatch 告警</text>
<text x="34" y="128" class="s">Prometheus Alertmanager</text>
<text x="34" y="148" class="s">Grafana 告警</text>
<text x="34" y="168" class="s">其他监控系统（Webhook）</text>
<text x="34" y="202" class="ok">≈ 现有告警平台</text>

<rect x="20" y="300" width="220" height="290" rx="8" class="fs"/>
<text x="34" y="324" class="t">飞书 / Lark 运维群</text>
<rect x="32" y="338" width="196" height="104" rx="6" class="in"/>
<text x="44" y="358" class="ti">应用机器人</text>
<text x="44" y="378" class="xs">（企业自建应用，群内唯一机器人）</text>
<text x="44" y="398" class="s">· 接收群内 @ 提问</text>
<text x="44" y="418" class="s">· 推送告警、调查、根因、</text>
<text x="56" y="434" class="s">恢复卡片</text>
<text x="34" y="468" class="ti">运维人员</text>
<text x="34" y="488" class="s">· @机器人 提问或发起调查</text>
<text x="34" y="508" class="s">· 查看根因与证据链</text>
<text x="34" y="528" class="s">· 确认处置建议后人工执行</text>
<text x="34" y="572" class="ok">≈ 现有飞书 Bot</text>

<!-- column B -->
<rect x="300" y="60" width="340" height="640" rx="10" class="acct"/>
<text x="315" y="84" class="t">运维账号（us-east-1）</text>
<rect x="315" y="95" width="310" height="125" rx="6" class="in"/>
<text x="329" y="117" class="ti">告警转换</text>
<text x="329" y="139" class="s">Amazon SNS / EventBridge → AWS Lambda</text>
<text x="329" y="158" class="s">标准化：关键上下文写入 description</text>
<text x="329" y="177" class="s">去重收敛：Amazon DynamoDB（TTL）</text>
<text x="329" y="196" class="s">HMAC 签名后调用 Webhook</text>

<text x="345" y="250" class="ti">飞书集成层（无公网入站端点）</text>
<rect x="315" y="258" width="310" height="74" rx="6" class="in"/>
<text x="329" y="279" class="ti">飞书长连接客户端</text>
<text x="329" y="299" class="s">Amazon ECS on AWS Fargate · 仅出站 443</text>
<text x="329" y="318" class="s">message_id 去重 · 群白名单 · 异步转交</text>
<path d="M470,332 V344" class="ln" marker-end="url(#a)"/>
<rect x="315" y="346" width="310" height="74" rx="6" class="in"/>
<text x="329" y="367" class="ti">问答 Worker（AWS Lambda）</text>
<text x="329" y="387" class="s">SigV4 调用 A2A：chat / investigation</text>
<text x="329" y="406" class="s">话题内多轮：保存 A2A taskId</text>
<rect x="315" y="434" width="310" height="74" rx="6" class="in"/>
<text x="329" y="455" class="ti">结果通知（AWS Lambda）</text>
<text x="329" y="475" class="s">订阅 EventBridge（source = aws.aidevops）</text>
<text x="329" y="494" class="s">读取调查摘要 → 飞书消息卡片</text>
<rect x="315" y="522" width="310" height="60" rx="6" class="in"/>
<text x="329" y="545" class="s">Amazon DynamoDB：去重与会话状态</text>
<text x="329" y="566" class="s">AWS Secrets Manager：飞书与 Webhook 凭证</text>
<text x="315" y="614" class="xs">· 飞书侧只需企业自建应用的 App ID / App Secret</text>
<text x="315" y="634" class="xs">· 事件经长连接接收，连接由客户端主动建立</text>
<text x="315" y="654" class="xs">· 卡片经飞书开放平台 API 出站发送</text>
<text x="315" y="674" class="xs">· 不需要 API Gateway 或公网回调地址</text>

<!-- column C -->
<rect x="690" y="60" width="270" height="640" rx="10" class="agent"/>
<text x="705" y="84" class="t">AWS DevOps Agent（托管）</text>
<text x="705" y="103" class="ok">≈ 自建 SRE Agent + 运维编排平台</text>
<rect x="705" y="112" width="240" height="50" rx="6" class="in"/>
<text x="717" y="132" class="ti">Webhook 入口</text>
<text x="717" y="151" class="s">HMAC · 告警自动触发调查</text>
<rect x="705" y="172" width="240" height="76" rx="6" class="in"/>
<text x="717" y="192" class="ti">Agent Space（按业务线划分）</text>
<text x="717" y="212" class="s">Triage → RCA → Mitigation</text>
<text x="717" y="231" class="s">Skills：runbook、跳过规则</text>
<rect x="705" y="258" width="240" height="74" rx="6" class="in"/>
<text x="717" y="279" class="ti">应用拓扑 + 变更关联</text>
<text x="717" y="299" class="s">资源依赖 · 部署记录</text>
<text x="717" y="318" class="s">配置变更（CloudTrail）</text>
<rect x="705" y="346" width="240" height="74" rx="6" class="in"/>
<text x="717" y="367" class="ti">A2A 入口（SigV4）</text>
<text x="717" y="387" class="s">chat：同步问答</text>
<text x="717" y="406" class="s">investigation：异步调查</text>
<rect x="705" y="434" width="240" height="74" rx="6" class="in"/>
<text x="717" y="455" class="ti">事件出口（EventBridge）</text>
<text x="717" y="475" class="s">Investigation Created / Completed</text>
<text x="717" y="494" class="s">Failed、Mitigation Completed 等</text>
<rect x="705" y="522" width="240" height="60" rx="6" class="in"/>
<text x="717" y="545" class="ti">自定义 MCP 工具白名单</text>
<text x="717" y="566" class="s">逐个工具标注 READ_ONLY</text>
<rect x="705" y="596" width="240" height="56" rx="6" class="in"/>
<text x="717" y="617" class="ti">Web App · IAM Identity Center</text>
<text x="717" y="638" class="s">调查日志：每一步依据可追溯</text>
<text x="705" y="674" class="warn">模型由 AWS 托管</text>
<text x="705" y="692" class="warn">自主调查只执行只读操作</text>

<!-- column D -->
<rect x="1010" y="60" width="370" height="190" rx="8" class="data"/>
<text x="1024" y="84" class="t">原生集成（IAM 只读角色）</text>
<text x="1024" y="108" class="s">Amazon CloudWatch 指标、日志、告警</text>
<text x="1024" y="128" class="s">AWS X-Ray · CloudWatch Application Signals</text>
<text x="1024" y="148" class="s">AWS CloudTrail 变更记录</text>
<text x="1024" y="168" class="s">Amazon EKS / ECS / RDS、AWS Lambda 等</text>
<text x="1024" y="188" class="s">GitHub / GitLab / Azure DevOps（代码与部署）</text>
<text x="1024" y="208" class="s">Grafana · Amazon Managed Service for Prometheus</text>
<text x="1024" y="236" class="xs">数据由 Agent 通过 Agent Space 角色直接读取，无需网络打通</text>

<rect x="1010" y="275" width="370" height="325" rx="8" class="data"/>
<text x="1024" y="298" class="t">自定义 MCP Server（只读工具）</text>
<text x="1024" y="316" class="xs">Streamable HTTP · HTTPS · OAuth / API Key / SigV4 认证</text>
<rect x="1022" y="328" width="346" height="124" rx="6" class="in"/>
<text x="1034" y="352" class="ti">A. Amazon Bedrock AgentCore Runtime</text>
<text x="1034" y="376" class="s">OAuth（JWT 授权器）· 标准 MCP SDK 基本不改</text>
<text x="1034" y="398" class="s">适合：迁移现有 ES / Prometheus MCP Server</text>
<text x="1034" y="420" class="s">Demo：es-mock（Amazon Cognito 签发令牌）</text>
<text x="1034" y="441" class="xs">端点公网可达，必须认证</text>
<rect x="1022" y="464" width="346" height="124" rx="6" class="in"/>
<text x="1034" y="488" class="ti">B. AWS Lambda + 函数 URL</text>
<text x="1034" y="512" class="s">SigV4（AWS_IAM 认证）· 适配 Lambda 请求模型</text>
<text x="1034" y="534" class="s">适合：新写的轻量只读工具（如 Nexus 查询）</text>
<text x="1034" y="556" class="s">Demo：nexus-mock（未签名请求返回 403）</text>
<text x="1034" y="577" class="xs">端点公网可达，必须认证</text>

<rect x="1010" y="622" width="370" height="78" rx="8" class="src"/>
<text x="1024" y="645" class="t">现有数据后端</text>
<text x="1024" y="667" class="s">Elasticsearch · Prometheus · Nexus</text>
<text x="1024" y="687" class="xs">位于其他区域或机房时：Transit Gateway / VPN / 专线</text>

<!-- governance -->
<rect x="20" y="722" width="1360" height="60" rx="8" class="gov"/>
<text x="34" y="746" class="ti">安全与治理</text>
<text x="34" y="768" class="s">IAM 最小权限 · AWS KMS 客户托管密钥 · AWS CloudTrail 审计 · AWS Secrets Manager 凭证 · CloudWatch 用量与成本告警 · 处置动作由值班人员确认后执行</text>
<text x="20" y="810" class="xs">箭头表示请求或数据流向；“≈”表示对应的现有组件。飞书集成层与 MCP Server 均部署在自有 AWS 账号内，AWS DevOps Agent 为 AWS 托管服务。</text>

<!-- arrows -->
<path d="M240,140 H313" class="ln" marker-end="url(#a)"/>
<text x="250" y="132" class="lbl">告警</text>
<path d="M330,220 V240 H130 V297" class="ln" marker-end="url(#a)"/>
<text x="180" y="234" class="lbl">告警卡片</text>
<path d="M240,316 H313" class="ln" marker-end="url(#a)"/>
<text x="252" y="308" class="lbl">@消息</text>
<text x="246" y="332" class="xs">（长连接）</text>
<path d="M315,471 H243" class="ln" marker-end="url(#a)"/>
<text x="254" y="463" class="lbl">卡片</text>
<path d="M625,137 H703" class="ln" marker-end="url(#a)"/>
<text x="645" y="129" class="lbl">HMAC</text>
<path d="M625,383 H703" class="ln" marker-end="url(#a)"/>
<text x="645" y="375" class="lbl">SigV4</text>
<path d="M705,471 H627" class="ln" marker-end="url(#a)"/>
<text x="650" y="463" class="lbl">事件</text>
<path d="M945,210 H1008" class="ln" marker-end="url(#a)"/>
<text x="968" y="202" class="lbl">只读</text>
<path d="M945,552 H1008" class="ln" marker-end="url(#a)"/>
<text x="966" y="544" class="lbl">MCP</text>
<path d="M1195,600 V620" class="ln" marker-end="url(#a)"/>
</svg>
