<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="mk"/></marker></defs>
<rect width="1400" height="860" class="bg"/>
<text x="20" y="36" class="h">Demo 部署架构：CloudFormation 栈 aiops-demo（us-east-1，无未认证的公网端点）</text>

<!-- col0: operator scripts -->
<rect x="20" y="60" width="230" height="460" rx="10" class="ops"/>
<text x="34" y="84" class="t">演示操作（运维人员本机）</text>
<text x="34" y="104" class="xs">AWS CLI v2 + Python 3.12</text>
<text x="34" y="134" class="code">deploy.sh</text>
<text x="34" y="151" class="xs">打包并部署整个栈</text>
<text x="34" y="180" class="code">scripts/setup-secrets.sh</text>
<text x="34" y="197" class="xs">交互录入 Webhook 与飞书凭证</text>
<text x="34" y="226" class="code">scripts/register-mcp.sh</text>
<text x="34" y="243" class="xs">注册两个 MCP，开放只读工具</text>
<text x="34" y="272" class="code">scripts/inject-fault.sh</text>
<text x="34" y="289" class="xs">模拟发布 1.4.0（注入故障）</text>
<text x="34" y="318" class="code">scripts/rollback.sh</text>
<text x="34" y="335" class="xs">回滚到 1.3.2</text>
<text x="34" y="364" class="code">scripts/test-mcp.sh</text>
<text x="34" y="381" class="code">scripts/test-feishu.sh</text>
<text x="34" y="398" class="xs">冒烟测试</text>
<text x="34" y="427" class="code">scripts/destroy.sh</text>
<text x="34" y="444" class="xs">删除栈与制品桶</text>
<text x="34" y="480" class="xs">Skill 在 DevOps Agent Web App</text>
<text x="34" y="497" class="xs">（Knowledge → Skills）上传</text>

<!-- col0: feishu -->
<rect x="20" y="550" width="230" height="250" rx="10" class="fs"/>
<text x="34" y="574" class="t">飞书演示群</text>
<rect x="32" y="584" width="206" height="68" rx="6" class="box"/>
<text x="44" y="603" class="ti">应用机器人</text>
<text x="44" y="621" class="xs">企业自建应用，群内唯一机器人</text>
<text x="44" y="639" class="xs">接收 @ 消息 · 以应用身份发消息</text>
<text x="34" y="676" class="s">· 告警卡片（红）</text>
<text x="34" y="696" class="s">· 开始调查卡片（蓝）</text>
<text x="34" y="716" class="s">· 根因分析卡片（绿）</text>
<text x="34" y="736" class="s">· 告警恢复卡片（绿）</text>
<text x="34" y="756" class="s">· @机器人 问答（话题内多轮）</text>
<text x="34" y="784" class="xs">卡片附 Web App 调查链接</text>

<!-- col1 ① workload -->
<rect x="290" y="60" width="300" height="250" rx="10" class="grp"/>
<text x="304" y="84" class="t">① 模拟业务：订单服务</text>
<rect x="304" y="96" width="272" height="44" rx="6" class="box"/>
<text x="316" y="115" class="ti">EventBridge 定时规则（每分钟）</text>
<text x="316" y="132" class="code">aiops-demo-traffic：20 次/分钟</text>
<rect x="304" y="150" width="272" height="44" rx="6" class="box"/>
<text x="316" y="169" class="ti">Lambda：aiops-demo-order-service</text>
<text x="316" y="186" class="code">ORDERS_TABLE · APP_VERSION</text>
<rect x="304" y="204" width="272" height="44" rx="6" class="box"/>
<text x="316" y="223" class="s">DynamoDB aiops-demo-orders</text>
<text x="316" y="240" class="s">SSM 参数：当前发布版本</text>
<rect x="304" y="258" width="272" height="42" rx="6" class="fault"/>
<text x="316" y="276" class="red">故障：发布 1.4.0</text>
<text x="316" y="293" class="xs">ORDERS_TABLE → 不存在的 aiops-demo-orders-v2</text>
<path d="M440,140 V148" class="ln" marker-end="url(#a)"/>
<path d="M440,194 V202" class="ln" marker-end="url(#a)"/>

<!-- col1 ② alert -->
<rect x="290" y="335" width="300" height="190" rx="10" class="grp"/>
<text x="304" y="359" class="t">② 告警转换</text>
<rect x="304" y="371" width="272" height="44" rx="6" class="box"/>
<text x="316" y="390" class="ti">CloudWatch 告警：Errors ≥ 5/分钟</text>
<text x="316" y="407" class="code">→ SNS aiops-demo-alerts</text>
<rect x="304" y="425" width="272" height="88" rx="6" class="box"/>
<text x="316" y="444" class="ti">Lambda：alert-forwarder</text>
<text x="316" y="463" class="s">· 告警 → Webhook 载荷，HMAC 签名</text>
<text x="316" y="481" class="s">· DynamoDB 去重收敛（15 分钟）</text>
<text x="316" y="499" class="s">· 告警 / 恢复卡片 → 飞书</text>
<path d="M440,415 V423" class="ln" marker-end="url(#a)"/>
<path d="M540,310 V369" class="ln" marker-end="url(#a)"/>
