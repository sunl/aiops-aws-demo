<!-- col1 ③ feishu integration -->
<rect x="290" y="550" width="300" height="250" rx="10" class="grp"/>
<text x="304" y="574" class="t">③ 飞书集成</text>
<rect x="304" y="586" width="272" height="72" rx="6" class="box"/>
<text x="316" y="605" class="ti">ECS Fargate：aiops-demo-feishu-ws</text>
<text x="316" y="623" class="s">长连接客户端（lark-oapi，ARM64）</text>
<text x="316" y="641" class="xs">安全组无入站规则 · 出站仅 443</text>
<rect x="304" y="668" width="272" height="56" rx="6" class="box"/>
<text x="316" y="687" class="ti">Lambda：chat-worker</text>
<text x="316" y="706" class="s">A2A：chat / investigation</text>
<rect x="304" y="734" width="272" height="56" rx="6" class="box"/>
<text x="316" y="753" class="ti">Lambda：feishu-notifier</text>
<text x="316" y="772" class="s">EventBridge 事件 → 调查摘要卡片</text>
<path d="M440,658 V666" class="ln" marker-end="url(#a)"/>

<!-- col2 agent -->
<rect x="650" y="60" width="280" height="740" rx="10" class="agent"/>
<text x="664" y="84" class="t">AWS DevOps Agent</text>
<text x="664" y="103" class="xs">Agent Space：aiops-demo（中文）</text>
<rect x="664" y="112" width="252" height="50" rx="6" class="box"/>
<text x="676" y="132" class="ti">原生数据源（只读角色）</text>
<text x="676" y="150" class="xs">CloudWatch · CloudTrail · Lambda 等</text>
<rect x="664" y="172" width="252" height="66" rx="6" class="box"/>
<text x="676" y="192" class="ti">Skill：order-service-release-rca</text>
<text x="676" y="210" class="xs">ES 错误摘要 → CloudTrail 子任务</text>
<text x="676" y="226" class="xs">→ Nexus 发布说明 → list_tables 核对</text>
<rect x="664" y="248" width="252" height="66" rx="6" class="box"/>
<text x="676" y="268" class="ti">MCP 工具（4 个，READ_ONLY）</text>
<text x="676" y="286" class="code">es_error_summary · es_search_logs</text>
<text x="676" y="302" class="code">nexus_list_versions · nexus_get_release</text>
<rect x="664" y="324" width="252" height="50" rx="6" class="box"/>
<text x="676" y="344" class="ti">Web App</text>
<text x="676" y="362" class="xs">调查日志：工具调用与推理过程</text>
<rect x="664" y="420" width="252" height="50" rx="6" class="box"/>
<text x="676" y="440" class="ti">通用 Webhook（HMAC）</text>
<text x="676" y="458" class="xs">告警创建调查；恢复时标记 resolved</text>
<rect x="664" y="490" width="252" height="66" rx="6" class="box"/>
<text x="676" y="510" class="ti">调查流程</text>
<text x="676" y="528" class="xs">Triage → RCA → Mitigation（处置建议）</text>
<text x="676" y="544" class="xs">自主调查只执行只读操作</text>
<rect x="664" y="670" width="252" height="50" rx="6" class="box"/>
<text x="676" y="690" class="ti">A2A 端点（SigV4）</text>
<text x="676" y="708" class="code">connect.aidevops.us-east-1.api.aws</text>
<rect x="664" y="736" width="252" height="50" rx="6" class="box"/>
<text x="676" y="756" class="ti">EventBridge（aws.aidevops）</text>
<text x="676" y="774" class="xs">Created / Completed / Failed / Mitigation</text>

<!-- col3 MCP -->
<rect x="990" y="60" width="390" height="250" rx="10" class="mcp"/>
<text x="1004" y="84" class="t">es-mock MCP（Elasticsearch 替身）</text>
<rect x="1004" y="96" width="362" height="92" rx="6" class="box"/>
<text x="1016" y="115" class="ti">Amazon Bedrock AgentCore Runtime</text>
<text x="1016" y="134" class="s">FastMCP 1.30.0 · 直接代码部署（arm64）</text>
<text x="1016" y="153" class="s">JWT 授权器 ← Amazon Cognito（机器对机器）</text>
<text x="1016" y="172" class="xs">认证：OAuth client credentials</text>
<rect x="1004" y="198" width="362" height="100" rx="6" class="box"/>
<text x="1016" y="217" class="ti">数据：CloudWatch Logs Insights</text>
<text x="1016" y="236" class="s">查询 order-service 日志，返回 Elasticsearch</text>
<text x="1016" y="254" class="s">_search 风格结果（hits / aggregations）</text>
<text x="1016" y="273" class="xs">执行角色只能查询这一个日志组</text>
<text x="1016" y="290" class="xs">查询文本限定安全字符集（防注入）</text>

<rect x="990" y="335" width="390" height="190" rx="10" class="mcp"/>
<text x="1004" y="359" class="t">nexus-mock MCP（Nexus 替身）</text>
<rect x="1004" y="371" width="362" height="72" rx="6" class="box"/>
<text x="1016" y="390" class="ti">AWS Lambda + 函数 URL（AWS_IAM）</text>
<text x="1016" y="409" class="s">SigV4：DevOps Agent 扮演专用调用角色</text>
<text x="1016" y="428" class="xs">未签名请求返回 403，函数代码不执行</text>
<rect x="1004" y="453" width="362" height="60" rx="6" class="box"/>
<text x="1016" y="472" class="ti">数据：静态发布说明 + SSM 版本</text>
<text x="1016" y="491" class="s">1.4.0 已知问题：建表迁移尚未执行</text>

<!-- col3 shared -->
<rect x="990" y="550" width="390" height="250" rx="10" class="grp"/>
<text x="1004" y="574" class="t">共享资源</text>
<rect x="1004" y="584" width="362" height="88" rx="6" class="box"/>
<text x="1016" y="603" class="ti">DynamoDB aiops-demo-state（TTL 自动过期）</text>
<text x="1016" y="622" class="code">alarm#     告警去重 15 分钟</text>
<text x="1016" y="638" class="code">feishu-msg# 消息去重 1 天</text>
<text x="1016" y="654" class="code">conv# 会话 2 小时 · task# 调查↔话题 1 天</text>
<rect x="1004" y="680" width="176" height="110" rx="6" class="box"/>
<text x="1016" y="699" class="ti">Secrets Manager</text>
<text x="1016" y="718" class="code">…/devops-agent-webhook</text>
<text x="1016" y="734" class="code">…/feishu</text>
<text x="1016" y="760" class="xs">setup-secrets.sh 录入</text>
<text x="1016" y="777" class="xs">值不出现在命令行与日志</text>
<rect x="1190" y="680" width="176" height="110" rx="6" class="box"/>
<text x="1202" y="699" class="ti">S3 制品桶 · 日志</text>
<text x="1202" y="718" class="xs">Lambda 代码包</text>
<text x="1202" y="734" class="xs">es-mock / feishu-ws zip</text>
<text x="1202" y="750" class="xs">（按内容哈希命名）</text>
<text x="1202" y="766" class="xs">已开启 S3 阻止公有访问</text>
<text x="1202" y="782" class="xs">日志保留 7 天</text>

